name: Daily AI & Tech Digest

# 定时说明：GitHub Actions 的 cron 一律按 UTC 解析。
# 0 0 * * *  =  北京时间每天 08:00
on:
  schedule:
    # 主运行：北京时间 08:00
    - cron: "0 0 * * *"
    # 补跑：北京时间 09:30。GitHub 负载高时会丢定时任务，这一条是兜底。
    # run.py 带幂等判断，今天已经发过就跳过，不会重复发信。
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成不发信（用于测试）"
        type: boolean
        default: false

permissions:
  contents: write          # 需要写权限来提交归档（同时保养仓库活跃度）

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成并发送日报
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 定时触发时 inputs 上下文不存在。用 env 传、在 shell 里判断，
          # 不要写 ${{ inputs.dry_run && '--dry-run' || '' }} —— 那种表达式在
          # schedule 事件下有让工作流校验失败、整个运行都起不来的风险。
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "== dry-run 模式：只生成不发信 =="
            python run.py --dry-run
          else
            python run.py
          fi

      - name: 显示抓取概况（便于排查某个源挂了）
        if: always()
        run: python show_raw.py || true

      - name: 失败告警（用同一个邮箱通知你）
        # 前面任何一步挂了就发一封告警信，带上原因和排查建议
        # 注意：如果故障本身是 SMTP 授权码失效，这封信也发不出，那种情况只能靠 GitHub 自己的通知
        if: failure()
        continue-on-error: true
        env:
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FROM_NAME: AI 日报告警
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_failure.py

      - name: 归档到仓库（同时防止 60 天不活跃被停用）
        # 邮件已经发出去了，归档失败不该把整次运行判成失败；但必须留下痕迹
        continue-on-error: true
        run: |
          set -x
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          # 定时触发的运行可能是 detached HEAD，先强制落到 main 上
          git checkout -B main
          git add -A outbox
          if git diff --staged --quiet; then
            echo "本次无新归档"
            exit 0
          fi
          git commit -m "digest: $(TZ=Asia/Shanghai date +%F)"
          git push origin HEAD:main
