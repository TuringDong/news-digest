name: Daily AI & Tech Digest
run-name: Daily digest · ${{ github.event_name }}

on:
  schedule:
    # UTC；北京时间 08:07 / 08:27 / 08:47 / 09:17 / 09:47。
    # GitHub 可能延迟调度，有效发送凭据用于避免重复发送。
    - cron: '7,27,47 0 * * *'
    - cron: '17,47 1 * * *'
    # 临时调度探针：只输出时间，不抓新闻、不调用模型、不发邮件。
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只生成不发信（用于测试）'
        type: boolean
        default: false
  repository_dispatch:
    types: [daily-digest]

permissions:
  contents: write

jobs:
  scheduler-probe:
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: 记录真实定时触发
        run: |
          echo "Scheduled event received at $(date -u --iso-8601=seconds)"
          echo "定时调度已触发。本次仅验证调度，不发送邮件。" >> "$GITHUB_STEP_SUMMARY"

  digest:
    if: github.event_name != 'schedule' || github.event.schedule != '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: daily-digest
      cancel-in-progress: false
    steps:
      - name: 取出默认分支最新代码与发送凭据
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成并发送日报
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python run.py --dry-run
          else
            python run.py
          fi

      - name: 显示抓取概况
        if: always()
        run: python show_raw.py || true

      - name: 归档日报和发送凭据
        run: |
          git config user.name 'digest-bot'
          git config user.email 'digest-bot@users.noreply.github.com'
          git add -A outbox
          if git diff --staged --quiet; then
            echo '本次无新归档'
            exit 0
          fi
          git commit -m "digest: $(TZ=Asia/Shanghai date +%F)"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo '日报及发送凭据已归档' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git pull --rebase origin main || exit 1
            sleep 5
          done
          echo '::error::发送凭据归档失败，请检查，后续调度可能重复发送。'
          exit 1

      - name: 失败告警
        if: failure()
        continue-on-error: true
        env:
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: '465'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FROM_NAME: AI 日报告警
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_failure.py
