name: Daily AI & Tech Digest

# 定时说明：GitHub Actions 的 cron 一律按 UTC 解析。
# 08:00 北京时间 = 00:00 UTC，但整点 UTC 是最拥堵的一分钟，
# 单条整点 cron 被丢弃是常见现象（本项目就踩过一次，整次没触发）。
on:
  schedule:
    # 北京时间多个时间点，只要有一次被调度到就成，故意的非整点。
    # run.py 有幂等判断（outbox/<日期>.sent），发过的日子后面几次直接跳过，
    # 所以你只会收到一封。
    - cron: "47 23 * * *"   # 07:47
    - cron: "7 0 * * *"     # 08:07
    - cron: "27 0 * * *"    # 08:27
    - cron: "47 0 * * *"    # 08:47
    - cron: "17 1 * * *"    # 09:17
    - cron: "47 1 * * *"    # 09:47
    # ↓↓↓ 临时：验证「GitHub 到底会不会调度这个工作流」，验证完删掉
    - cron: "32 3 * * *"    # 11:32
    - cron: "47 3 * * *"    # 11:47
    # ↑↑↑
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成不发信（用于测试）"
        type: boolean
        default: false
  # 备用触发器：如果 GitHub 的 cron 一直不调度，可以用外部定时服务
  # （如 cron-job.org）调一次 GitHub API 来触发，完全绕开 cron。
  # POST /repos/<owner>/<repo>/dispatches  body: {"event_type":"daily-digest"}
  repository_dispatch:
    types: [daily-digest]

permissions:
  contents: write          # 需要写权限来提交归档（同时保养仓库活跃度）

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成并发送日报
        env:
          TZ: Asia/Shanghai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 用 github.event.inputs（任何触发方式下都存在）而不是 inputs 上下文，
          # 避免 schedule 触发时出现未定义上下文的歧义。
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "== dry-run 模式：只生成不发信 =="
            python run.py --dry-run
          else
            python run.py
          fi

      - name: 显示抓取概况（便于排查某个源挂了）
        if: always()
        run: python show_raw.py || true

      - name: 失败告警（用同一个邮箱通知你）
        # 前面任何一步挂了就发一封告警信，带上原因和排查建议
        # 注意：如果故障本身是 SMTP 授权码失效，这封信也发不出，那种情况只能靠 GitHub 自己的通知
        if: failure()
        continue-on-error: true
        env:
          SMTP_HOST: smtp.qq.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FROM_NAME: AI 日报告警
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_failure.py

      - name: 归档到仓库（同时防止 60 天不活跃被停用）
        # 邮件已经发出去了，归档失败不该把整次运行判成失败；但必须留下痕迹
        continue-on-error: true
        run: |
          set -x
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          # 定时触发的运行可能是 detached HEAD，先强制落到 main 上
          git checkout -B main
          git add -A outbox
          if git diff --staged --quiet; then
            echo "本次无新归档"
            exit 0
          fi
          git commit -m "digest: $(TZ=Asia/Shanghai date +%F)"
          # 推送失败就重试几次：失败的话 .sent 标记没上去，
          # 后面那次定时触发会误以为没发过，可能重复发信
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "归档已推送"
              exit 0
            fi
            echo "推送失败，第 $i 次，10 秒后重试"
            sleep 10
          done
          echo "::warning::归档推送连续失败，.sent 标记没上去，下一次定时触发可能重复发信"
          exit 1
